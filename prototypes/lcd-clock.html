<!doctype html>
<!--
  PROTOTYPE · throwaway. Not production code.
  Question (wayfinder ticket "LCD clock details, small clock, and colon", kttq/alba#5):
  how does the seven-segment LCD clock look in detail, and what does the small clock look like?
  Built on the harness of kttq/alba#4 (tag prototype/home-layout), with its chosen Home layout (variant D, gadget LCD).
  Round 1 compared four segment shapes (gapped, filled, rounded, italic); the user chose gapped corners.
  Round 2 (this file) keeps only that shape and the options still open: thickness 1 or 2 for the Large clock,
  spacing, the colon, ghost segments, the 7 hook, and the 12-hour mark (stack or text).
  Round 3 scrapped the pixel Mini clock (tiny 3×5 gapped digits were illegible and needed 39×3); Mini keeps the text clock.
  Weather icons are still drafts; their design belongs to another ticket.
  Open by double-clicking. Keys: g ghost · f 12/24h · c colon · t time · w weather · p palette.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>PROTOTYPE · alba LCD clock</title>
<style>
  @font-face { font-family: "DM"; src: local("Departure Mono"), local("DepartureMono-Regular"); }

<body>
<h1>PROTOTYPE · alba LCD clock, small clock, and colon</h1>
<p class="note">Throwaway. Icons are drafts. Blocks and box lines are drawn as full-cell shapes, the way Ghostty draws them. The dashed outline is the pane. Below the pane: a digit sheet at all three sizes, then every tier.</p>

<div class="controls" id="controls"></div>
<div class="main">
  <canvas class="pane" id="pane"></canvas>
  <div class="state" id="state"></div>
</div>
<h1 style="margin-top:22px">digit sheet</h1>
<canvas class="pane" id="sheet"></canvas>
<div class="gallery" id="gallery"></div>

<script>
// ---------- state & url ----------
const Q = new URLSearchParams(location.search);
const state = {
  cond: Q.get('cond') || 'rain',
  time: Q.get('time') || 'now',
  ghost: Q.get('ghost') || 'on',
  fmt: Q.get('fmt') || '24',          // 24 or 12 hour
  ampm: Q.get('ampm') || 'stack',     // 12h mark on the LCD clock: stack or text
  lgT: +Q.get('lgT') || 2,            // segment thickness of the Large clock
  dgap: +Q.get('dgap') || 1,          // pixels between digits
  cgap: Q.get('cgap') || 'auto',      // pixels on each side of the colon
  colon: Q.get('colon') || 'ghost',   // colon when off: ghost, blank; or steady (never blinks)
  cshape: Q.get('cshape') || 'dot',   // colon dots: dot (square) or tall
  tails: Q.get('tails') || 'on',      // top bar on 6, bottom bar on 9
  hook: Q.get('hook') || 'off',       // 7 with a left hook (segment f)
  phase: Q.get('phase') || 'auto',
  cols: +Q.get('cols') || 85,
  rows: +Q.get('rows') || 26,
  lang: Q.get('lang') || 'en',
  date: Q.get('date') || 'now',
  bezel: Q.get('bezel') || 'open',
  palette: Q.get('palette') || 'gkrc-dark',
  zoom: +Q.get('zoom') || 2,
};
const syncURL = () => history.replaceState(null, '', '?' + new URLSearchParams(state));

// ---------- palettes (16 terminal colors + fg/bg) ----------
const PALETTES = {
  'gkrc-dark':  { bg: '#16120e', fg: '#e3d6b8', c: ['#16120e','#d25f42','#8f9a5a','#d49a3a','#7f93a8','#a8707a','#7aa08c','#cfc1a3','#8d7d65','#dd7357','#b0b878','#e8bd6a','#a3b3c2','#c9939a','#9fc0ab','#f3ead3'] },
  'gkrc-light': { bg: '#eddca8', fg: '#241a0c', c: ['#241a0c','#9a3522','#4f5a1c','#7a4f06','#34506a','#763a48','#2f6048','#7d6c4c','#6a5737','#82291a','#414a14','#664105','#2c4358','#61303c','#26503c','#241a0c'] },
  'generic-dark':  { bg: '#000000', fg: '#e5e5e5', c: ['#000000','#c23621','#25bc24','#adad27','#492ee1','#d338d3','#33bbc8','#cbcccd','#818383','#fc391f','#31e722','#eaec23','#5833ff','#f935f8','#14f0f0','#e9ebeb'] },
  'generic-light': { bg: '#ffffff', fg: '#000000', c: ['#000000','#990000','#00a600','#999900','#0000b2','#b200b2','#00a6b2','#bfbfbf','#666666','#e50000','#00d900','#e5e500','#0000ff','#e500e5','#00e5e5','#e5e5e5'] },
};
// Color roles from the proposal, by terminal color name.
const ROLE = { fg: 'fg', ghost: 8, frame: 8, dim: 8, accent: 3, date: 4, secondary: 2, rain: 4, snow: 15, cloud: 7, weekend: 2 };
// A role written '~N' means terminal color N in faint style.
const color = (pal, role) => { if (typeof role === 'string' && role[0] === '~') role = +role.slice(1); const r = ROLE[role] ?? role; return r === 'fg' ? pal.fg : pal.c[r]; };
const isFaint = r => r === 'ghost' || (typeof r === 'string' && r[0] === '~');

// ---------- strings ----------
const STR = {
  en: {
    days: ['sunday','monday','tuesday','wednesday','thursday','friday','saturday'],
    short: ['sun','mon','tue','wed','thu','fri','sat'],
    months: ['january','february','march','april','may','june','july','august','september','october','november','december'],
    cal: ['mo','tu','we','th','fr','sa','su'],
    cond: 'rain', wk: 'wk', next12: 'rain · next 12h', sunsetIn: 'sunset in',
    phases: ['new moon', 'waxing crescent', 'first quarter', 'waxing gibbous', 'full moon', 'waning gibbous', 'last quarter', 'waning crescent'], sunriseIn: 'sunrise in',
    conds: { clear: 'clear', partly: 'partly cloudy', rain: 'rain', snow: 'snow', storm: 'thunderstorm' },
    greet: h => h < 5 ? 'sleep soon ✦' : h < 12 ? 'good morning ♥' : h < 18 ? 'good afternoon ★' : h < 23 ? 'good evening ★' : 'sleep soon ✦',
  },
  es: {
    days: ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'],
    short: ['dom','lun','mar','mié','jue','vie','sáb'],
    months: ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'],
    cal: ['lu','ma','mi','ju','vi','sá','do'],
    cond: 'lluvia', wk: 'sem', next12: 'lluvia · 12 h', sunsetIn: 'atardece en',
    phases: ['luna nueva', 'luna creciente', 'cuarto creciente', 'gibosa creciente', 'luna llena', 'gibosa menguante', 'cuarto menguante', 'luna menguante'], sunriseIn: 'amanece en',
    conds: { clear: 'despejado', partly: 'algo nublado', rain: 'lluvia', snow: 'nieve', storm: 'tormenta' },
    greet: h => h < 5 ? 'a dormir pronto ✦' : h < 12 ? 'buenos días ♥' : h < 20 ? 'buenas tardes ★' : h < 23 ? 'buenas noches ★' : 'a dormir pronto ✦',
  },
};
const len = s => [...s].length;

// ---------- blocks: a grid of cells, each {ch, role, bold} or null ----------
const blank = (w, h) => ({ w, h, cells: Array.from({ length: h }, () => Array(w).fill(null)) });
function line(...segs) {
  const cells = [];
  for (const [t, role = 'fg', bold = false] of segs) for (const ch of t) cells.push(ch === ' ' ? null : { ch, role, bold, dim: isFaint(role) });
  return { w: cells.length, h: 1, cells: [cells] };
}
function art(rows, roleOf) {
  const h = rows.length, w = Math.max(...rows.map(len)), b = blank(w, h);
  rows.forEach((r, y) => [...r].forEach((ch, x) => { if (ch !== ' ') b.cells[y][x] = { ch, role: typeof roleOf === 'function' ? roleOf(ch) : roleOf, bold: false }; }));
  return b;
}
function place(dst, src, x, y) {
  for (let j = 0; j < src.h; j++) for (let i = 0; i < src.w; i++) {
    const c = src.cells[j][i];
    if (c && y + j >= 0 && y + j < dst.h && x + i >= 0 && x + i < dst.w) dst.cells[y + j][x + i] = c;
  }
}
const sp = (h = 1) => blank(0, h);
function vstack(bs, { align = 'center' } = {}) {
  bs = bs.filter(Boolean);
  const w = Math.max(0, ...bs.map(b => b.w)), h = bs.reduce((s, b) => s + b.h, 0), o = blank(w, h);
  let y = 0;
  for (const b of bs) { place(o, b, align === 'center' ? Math.floor((w - b.w) / 2) : 0, y); y += b.h; }
  return o;
}
function hstack(bs, { gap = 1, valign = 'top' } = {}) {
  bs = bs.filter(Boolean);
  const h = Math.max(0, ...bs.map(b => b.h)), w = bs.reduce((s, b) => s + b.w, 0) + gap * Math.max(0, bs.length - 1), o = blank(w, h);
  let x = 0;
  for (const b of bs) { place(o, b, x, valign === 'center' ? Math.floor((h - b.h) / 2) : valign === 'bottom' ? h - b.h : 0); x += b.w + gap; }
  return o;
}

// ---------- context (time, date, strings) ----------
function makeCtx(real) {
  const S = STR[state.lang];
  // The "time" control overrides the clock so the sun arc and day/night icons can be previewed.
  const now = new Date(real);
  if (state.time !== 'now') { const [H, M] = state.time.split(':').map(Number); now.setHours(H, M); }
  // "longest" = the widest header in either language: wednesday / miércoles 30 september / septiembre.
  const date = state.date === 'longest' ? new Date(2026, 8, 30, now.getHours(), now.getMinutes(), now.getSeconds()) : now;
  // 12-hour: no leading zero, so the first digit is blank (" 6"); on the LCD it shows as a ghost 8.
  const H24 = now.getHours(), pm = H24 >= 12;
  const hh = state.fmt === '12' ? String(H24 % 12 || 12).padStart(2, ' ') : String(H24).padStart(2, '0');
  const mm = String(now.getMinutes()).padStart(2, '0');
  const mins = now.getHours() * 60 + now.getMinutes(), rise = 6 * 60 + 14, set = 19 * 60 + 6;
  const day = mins >= rise && mins < set;
  const RAIN = { rain: [20, 35, 60, 85, 70, 45, 30, 20, 15, 10, 5, 5], storm: [40, 70, 90, 80, 50, 30, 20, 10, 5, 5, 5, 0], snow: [30, 40, 50, 50, 40, 30, 20, 10, 10, 5, 0, 0], partly: [0, 0, 5, 10, 20, 15, 5, 0, 0, 0, 0, 0], clear: Array(12).fill(0) };
  return {
    S, date, hh, mm, pm, hour: now.getHours(),
    colonOn: state.colon === 'steady' || real.getMilliseconds() < 500,   // blink once per second
    frame2: Math.floor(real.getTime() / 500) % 2,     // two-frame idle animation at 2 fps
    flash: real.getTime() % 7000 < 180,               // rare thunderstorm flash
    temp: '14°', hi: '18°', lo: '9°', sunrise: '06:14', sunset: '19:06',
    cond: state.cond, day, night: !day,
    dayProgress: day ? (mins - rise) / (set - rise) : null,
    toSunrise: day ? null : ((rise - mins + 1440) % 1440),
    toSunset: day ? set - mins : null,
    nightProgress: day ? null : ((mins - set + 1440) % 1440) / (1440 - (set - rise)),
    phase: state.phase === 'auto' ? moonPhase(now) : +state.phase,
    rain12: RAIN[state.cond],
  };
}

// ---------- components ----------
// Text clock for Mini and Strip: "06:38", or "6:38pm" in 12-hour. The colon follows the colon control:
// blinks to faint (ghost), blinks to blank, or stays on (steady).
const textClock = c => {
  const colon = c.colonOn ? [':', 'accent', true] : state.colon === 'blank' ? [' ', 'accent'] : [':', 'ghost'];
  return [[c.hh.trim(), 'accent', true], colon, [c.mm, 'accent', true], ...(state.fmt === '12' ? [[c.pm ? 'pm' : 'am', 'dim']] : [])];
};
const smallClock = c => line(...textClock(c));
// PLACEHOLDER icons (rain). The real set belongs to "Weather icons: the full set with two animation frames".
const iconFull = c => art(['  ▄▄▄▄  ', '▄██████▄', ...(c.frame2 ? ['   ‚  ‚ ', ' ‚  ‚  ‚'] : [' ‚  ‚  ‚', '   ‚  ‚ '])], ch => ch === '‚' ? 'rain' : 'cloud');
const iconMini = c => art(['▄██▄', c.frame2 ? ' ‚ ‚' : '‚ ‚ '], ch => ch === '‚' ? 'rain' : 'cloud');
const tempLine = c => line([c.temp, 'fg', true], [' ' + c.S.cond, 'secondary']);
const sunLine = c => line(['↑', 'accent'], [c.sunrise, 'dim'], ['  ↓', 'accent'], [c.sunset, 'dim']);
const credit = () => line(['open-meteo.com', 'dim']);
const details4 = c => vstack([line([c.temp, 'fg', true]), line([c.S.cond, 'secondary']), line(['↑', 'accent'], [c.sunrise, 'dim']), line(['↓', 'accent'], [c.sunset, 'dim'])], { align: 'left' });

// Month calendar, Monday first. Always 6 week rows, so the layout never jumps between months.
function monthCal(c) {
  const d = c.date, y = d.getFullYear(), m = d.getMonth(), today = d.getDate();
  const days = new Date(y, m + 1, 0).getDate(), off = (new Date(y, m, 1).getDay() + 6) % 7;
  const b = blank(20, 8), title = `${c.S.months[m]} ${y}`;
  place(b, line([title, 'date']), Math.floor((20 - len(title)) / 2), 0);
  c.S.cal.forEach((w, i) => place(b, line([w, i >= 5 ? 'weekend' : 'dim']), i * 3, 1));
  for (let day = 1; day <= days; day++) {
    const idx = off + day - 1, col = idx % 7, row = Math.floor(idx / 7);
    const role = day === today ? 'accent' : day < today ? 'dim' : col >= 5 ? 'weekend' : 'fg';
    place(b, line([String(day).padStart(2, ' '), role, day === today]), col * 3, 2 + row);
  }
  return b;
}
// One-week strip: the current week only.
function weekStrip(c) {
  const d = c.date, dow = (d.getDay() + 6) % 7, b = blank(20, 2);
  c.S.cal.forEach((w, i) => {
    const day = new Date(d.getFullYear(), d.getMonth(), d.getDate() - dow + i);
    const isToday = i === dow;
    place(b, line([w, i >= 5 ? 'weekend' : 'dim']), i * 3, 0);
    place(b, line([String(day.getDate()).padStart(2, ' '), isToday ? 'accent' : i < dow ? 'dim' : i >= 5 ? 'weekend' : 'fg', isToday]), i * 3, 1);
  });
  return b;
}
const headerText = c => [[c.S.days[c.date.getDay()], 'date'], [state.bezel === 'none' ? ' · ' : ' ─ ', 'frame'], [`${c.date.getDate()} ${c.S.months[c.date.getMonth()]}`, 'date']];
const footerText = c => [[c.S.greet(c.hour), 'secondary']];

// ---------- bezel ----------
// none:   plain header and footer lines, no box characters.
// open:   the proposal's Starship look, ╭─ header and ╰─» footer, no sides.
// closed: a box that hugs the content; header and footer sit in the top and bottom border.
// fill:   a box that fills the whole pane, like a gadget's screen edge.
function applyBezel(inner, c, withText, W, H) {
  const hdr = withText ? headerText(c) : null, ftr = withText ? footerText(c) : null;
  const segLen = segs => segs.reduce((s, [t]) => s + len(t), 0);
  const mode = state.bezel;
  if (mode === 'none' || mode === 'open') {
    if (!withText) return inner;
    const h = mode === 'open' ? line(['╭─ ', 'frame'], ...hdr) : line(...hdr);
    const f = mode === 'open' ? line(['╰─» ', 'frame'], ...ftr) : line(...ftr);
    const w = Math.max(inner.w, h.w, f.w), o = blank(w, inner.h + 2);
    place(o, h, 0, 0); place(o, inner, Math.floor((w - inner.w) / 2), 1); place(o, f, 0, inner.h + 1);
    return o;
  }
  // closed / fill: sides plus one space of padding on each side.
  const minW = Math.max(inner.w + 4, withText ? Math.max(segLen(hdr) + 6, segLen(ftr) + 7) : 0), minH = inner.h + 2;
  const w = mode === 'fill' ? W : minW, h = mode === 'fill' ? H : minH;
  if (w < minW || h < minH) return { w: Infinity, h: Infinity, minW, minH };
  const o = blank(w, h);
  const top = withText ? line(['╭─ ', 'frame'], ...hdr, [' ', 'frame']) : line(['╭', 'frame']);
  const bot = withText ? line(['╰─» ', 'frame'], ...ftr, [' ', 'frame']) : line(['╰', 'frame']);
  for (let x = 1; x < w - 1; x++) { o.cells[0][x] = { ch: '─', role: 'frame' }; o.cells[h - 1][x] = { ch: '─', role: 'frame' }; }
  for (let y = 1; y < h - 1; y++) { o.cells[y][0] = { ch: '│', role: 'frame' }; o.cells[y][w - 1] = { ch: '│', role: 'frame' }; }
  // Copy the text rows cell by cell, spaces included, so the border line doesn't show through the gaps.
  top.cells[0].forEach((cell, x) => { o.cells[0][x] = cell; });
  bot.cells[0].forEach((cell, x) => { o.cells[h - 1][x] = cell; });
  o.cells[0][w - 1] = { ch: '╮', role: 'frame' }; o.cells[h - 1][w - 1] = { ch: '╯', role: 'frame' };
  place(o, inner, Math.floor((w - inner.w) / 2), 1 + Math.floor((h - 2 - inner.h) / 2));
  o.minW = minW; o.minH = minH;
  return o;
}

// ---------- Mini and Strip tiers ----------
const stripTier = {
  name: 'strip', credit: false, framed: false, strip: true,
  options: c => [
    line(...textClock(c), [' · ', 'dim'], [`${c.S.short[c.date.getDay()]} ${c.date.getDate()}`, 'date'], [' · ', 'dim'], [c.temp + ' ', 'fg'], ['‚‚', 'rain']),
    line(...textClock(c), [' · ', 'dim'], [c.temp + ' ', 'fg'], ['‚‚', 'rain']),
    line(...textClock(c)),
  ],
};

// =====================================================================
// Variants D and E: the "break free" designs.
// Pixel engine: each cell holds two square pixels, top and bottom, drawn with ▀ ▄ █ and a
// foreground plus background color. ratatui can do this with Cell fg/bg.
// "ghost" pixels are bright black with the terminal's faint (dim) style, like unlit LCD segments.
// =====================================================================
function pcell(t, u) {
  if (!t && !u) return null;
  if (t === u) return { ch: '█', role: t, dim: isFaint(t) };
  if (t && !u) return { ch: '▀', role: t, dim: isFaint(t) };
  if (!t && u) return { ch: '▄', role: u, dim: isFaint(u) };
  // Both set and different: the faint pixel must be the foreground, because the background can't be faint.
  if (isFaint(u)) return { ch: '▄', role: u, dim: true, bg: t };
  return { ch: '▀', role: t, dim: isFaint(t), bg: u };
}
// grid: rows of roles (or null), any height; returns a block of ceil(h/2) rows.
function fromGrid(grid) {
  const hp = grid.length, w = Math.max(0, ...grid.map(r => r.length)), b = blank(w, Math.ceil(hp / 2));
  for (let y = 0; y < b.h; y++) for (let x = 0; x < w; x++) b.cells[y][x] = pcell(grid[2 * y]?.[x] ?? null, grid[2 * y + 1]?.[x] ?? null);
  return b;
}
const pix = (rows, legend) => fromGrid(rows.map(r => [...r].map(ch => legend[ch] ?? null)));
const ghostOn = () => state.ghost === 'on';

// Seven-segment digits, w×h pixels, segment thickness t. Segments stop short of the corners.
const SEG = { 0: 'abcdef', 1: 'bc', 2: 'abged', 3: 'abgcd', 4: 'fgbc', 5: 'afgcd', 6: 'afgedc', 7: 'abc', 8: 'abcdefg', 9: 'abcdfg' };
const SMALL = { w: 4, h: 7, t: 1 }, LARGE = () => ({ w: 8, h: 15, t: state.lgT });
function segsOf(d) {
  let s = SEG[d];
  if (state.tails === 'off' && d === '6') s = s.replace('a', '');
  if (state.tails === 'off' && d === '9') s = s.replace('d', '');
  if (state.hook === 'on' && d === '7') s += 'f';
  return s;
}
function segMask({ w, h, t }, segs) {
  const g = Array.from({ length: h }, () => Array(w).fill(false)), m = Math.floor((h - t) / 2);
  const H = y0 => { for (let y = y0; y < y0 + t; y++) for (let x = t; x < w - t; x++) g[y][x] = true; };
  const V = (x0, y0, y1) => { for (let y = y0; y < y1; y++) for (let x = x0; x < x0 + t; x++) g[y][x] = true; };
  if (segs.includes('a')) H(0); if (segs.includes('g')) H(m); if (segs.includes('d')) H(h - t);
  if (segs.includes('f')) V(0, t, m); if (segs.includes('b')) V(w - t, t, m);
  if (segs.includes('e')) V(0, m + t, h - t); if (segs.includes('c')) V(w - t, m + t, h - t);
  return g;
}
// tokens: { k: '0'…'9' } a digit, { k: ' ' } a blank digit (ghost 8 only), { k: ':', on } the colon.
function lcdGrid(tokens, size) {
  const { w, h, t } = size, cg = state.cgap === 'auto' ? t + 1 : +state.cgap;
  const xs = [];
  let W = 0;
  tokens.forEach((tk, i) => {
    if (i) W += tk.k === ':' || tokens[i - 1].k === ':' ? cg : state.dgap;
    xs.push(W); W += tk.k === ':' ? t : w;
  });

    `<span><label>pane</label> <input type="number" id="cols" min="1" max="200" value="${state.cols}"> × <input type="number" id="rows" min="1" max="80" value="${state.rows}"></span>`,
    `<span class="seg">${PRESETS.map(([w, h]) => `<button data-preset="${w}x${h}" class="${state.cols === w && state.rows === h ? 'on' : ''}">${w}×${h}</button>`).join('')}</span>`,
    seg('ghost segments', 'ghost', ['on', 'off']),
    seg('colon when off', 'colon', ['ghost', 'blank', 'steady']),
    seg('colon dots', 'cshape', ['dot', 'tall']),
    seg('digit gap', 'dgap', [1, 2]),
    seg('colon gap', 'cgap', ['auto', 1, 2, 3]),
    seg('large thickness', 'lgT', [1, 2]),
    seg('6 and 9 tails', 'tails', ['on', 'off']),
    seg('7 hook', 'hook', ['off', 'on']),
    seg('format', 'fmt', ['24', '12']),
    seg('12h mark', 'ampm', ['stack', 'text']),
    seg('time', 'time', TIMES),
    seg('weather', 'cond', ['rain', 'clear', 'partly', 'snow', 'storm']),
    seg('lang', 'lang', ['en', 'es']),
    seg('palette', 'palette', Object.keys(PALETTES)),
    seg('zoom', 'zoom', [1, 2, 3]),
  ].join('');
  document.querySelectorAll('[data-k]').forEach(b => b.onclick = () => { const k = b.dataset.k; state[k] = typeof state[k] === 'number' ? +b.dataset.v : b.dataset.v; update(); });
  document.querySelectorAll('[data-preset]').forEach(b => b.onclick = () => { [state.cols, state.rows] = b.dataset.preset.split('x').map(Number); update(); });
  document.getElementById('cols').onchange = e => { state.cols = Math.max(1, +e.target.value); update(); };
  document.getElementById('rows').onchange = e => { state.rows = Math.max(1, +e.target.value); update(); };
}
const cycle = (key, list, dir = 1) => { state[key] = list[(list.indexOf(state[key]) + dir + list.length) % list.length]; update(); };
addEventListener('keydown', e => {
  if (e.target.closest('input, textarea, [contenteditable]')) return;
  if (e.key === 'g') cycle('ghost', ['on', 'off']);
  if (e.key === 'f') cycle('fmt', ['24', '12']);
  if (e.key === 'c') cycle('colon', ['ghost', 'blank', 'steady']);
  if (e.key === 't') cycle('time', TIMES);
  if (e.key === 'w') cycle('cond', ['rain', 'clear', 'partly', 'snow', 'storm']);
  if (e.key === 'p') cycle('palette', Object.keys(PALETTES));
});

// ---------- digit sheet: every digit at every size, the colon on and off, and hard cases ----------
function sheet(c) {
  const rows = [];
  for (const [name, size] of [[`large 8×15, thickness ${state.lgT}`, LARGE()], ['small 4×7', SMALL]]) {
    const colon = on => fromGrid(lcdGrid([...digitTokens('12'), { k: ':', on }, ...digitTokens('34')], size));
    rows.push(line([name, 'dim']), lcdText('0123456789', size), sp(),
      hstack([lcdText('11:11', size), lcdText(' 7:17', size), colon(true), colon(false)], { gap: 4 }), sp());
  }
  rows.push(line(['  12:34 colon on and off · 11:11 and " 7:17" test the 1, the 7, and a blank 12-hour digit', 'dim']), sp(),
    line(['text clock: ', 'dim'], ...textClock(c)));
  return vstack(rows, { align: 'left' });
}
const sizeOf = b => `${b.w}×${b.h} cells`;

// ---------- loop ----------
function frame() {
  const now = new Date();
  const r = compose(state.cols, state.rows, now), c = makeCtx(now);
  render(document.getElementById('pane'), r.pane, state.zoom);
  render(document.getElementById('sheet'), sheet(c), state.zoom);
  const t = r.chosen;
  document.getElementById('state').textContent = [
    `pane      ${state.cols}×${state.rows}   tier ${t.tier.name}${r.chosen.clipped ? '   ⚠ CLIPPED: nothing fits' : ''}`,
    `content   ${t.blk.w}×${t.blk.h}   leftover ${state.cols - t.blk.w} cols, ${state.rows - t.blk.h} rows`,
    ``,
    `large clock   ${sizeOf(lcdClock(c, LARGE()))}  (8×15 px, thickness ${state.lgT})`,
    `small clock   ${sizeOf(lcdClock(c, SMALL))}  (4×7 px)`,
    `Mini clock    ${sizeOf(smallClock(c))}  (text)`,
    `ghost ${state.ghost} · colon off = ${state.colon}, ${state.cshape} · gaps digit ${state.dgap}, colon ${state.cgap}`,
    `tails ${state.tails} · 7 hook ${state.hook} · ${state.fmt}h${state.fmt === '12' ? ', mark ' + state.ampm : ''}`,
    `time ${state.time} · weather ${state.cond} · ${state.lang} · ${state.palette}`,
    ``,
    `smallest pane for each tier (= its breakpoint):`,
    ...r.table.map(x => `  ${x.name.padEnd(10)} ${x.size}${x.credit ? '' : '  (no credit)'}`),
  ].join('\n');
  // gallery: every preset size, one zoom step smaller
  // The Mini tier's own size comes first: the 12-hour mark widens it.
  const mini = r.table.find(x => x.name === 'mini').size.split('×').map(Number), sizes = [mini, ...PRESETS];
  const gal = document.getElementById('gallery');
  if (gal.children.length !== sizes.length) gal.innerHTML = sizes.map(() => '<figure><canvas class="pane"></canvas><figcaption></figcaption></figure>').join('');
  sizes.forEach(([w, h], i) => {
    const fig = gal.children[i], g = compose(w, h, now);
    render(fig.querySelector('canvas'), g.pane, Math.max(1, state.zoom - 1));
    fig.querySelector('figcaption').textContent = `${w}×${h} → ${g.chosen.tier.name}${g.chosen.clipped ? ' ⚠' : ''}`;
  });
}
function update() { syncURL(); drawControls(); frame(); }
document.fonts.load('22px DM').finally(() => { update(); setInterval(frame, 250); });
</script>
</body>
</html>
