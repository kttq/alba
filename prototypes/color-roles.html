<!doctype html>
<!--
  PROTOTYPE · throwaway. Not production code.
  Question (wayfinder ticket "Color roles on light and dark themes", kttq/alba#7):
  does each color role read well on all four palettes? Built on prototype/weather-icons (kttq/alba#6), with the roles
  decided in #7: clock, cloud, snow, fog and stars in the default foreground; date and rain in bright blue;
  moon, bolt and sun in yellow; no bold. Press p to cycle the four palettes.
  Built on prototype/lcd-clock (kttq/alba#5), which carries the Home layout chosen in kttq/alba#4 (variant D)
  and the clock chosen in #5 (gapped corners, thickness 2, ghost segments on, colon blinks to a ghost).
  Plan: three icon styles (A hand-drawn with a 2× Large icon, B geometric drawn at each size, C outline),
  switchable via ?variant=, shown in the real Home view and in an icon sheet with every condition, both frames, all sizes.
  The moon's dark side, the stars, the thunderstorm flash, and the animation speed are separate controls.
  Open by double-clicking. Keys: ← → variant · w weather · t time · p palette.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>PROTOTYPE · alba color roles</title>
<style>
  @font-face { font-family: "DM"; src: local("Departure Mono"), local("DepartureMono-Regular"); }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px 16px 96px; background: #3a3a3a; color: #ddd; font: 13px/1.4 system-ui, sans-serif; }

  .note { color: #aaa; margin: 0 0 12px; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; margin-bottom: 14px; }

  .controls button, .controls input { font: inherit; }
  .controls input[type=number] { width: 56px; }
  .seg button { background: #555; color: #eee; border: 0; padding: 3px 8px; cursor: pointer; }
  .seg button.on { background: #e8bd6a; color: #16120e; }
  .main { display: flex; gap: 24px; align-items: flex-start; flex-wrap: wrap; }
  .pane { outline: 1px dashed #888; outline-offset: 0; display: block; }
  .state { font: 12px/1.5 ui-monospace, monospace; background: #2a2a2a; padding: 10px 12px; min-width: 300px; white-space: pre; }
  .gallery { display: flex; flex-wrap: wrap; gap: 18px; margin-top: 22px; align-items: flex-end; }
  .gallery figure { margin: 0; }

  .switcher { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); display: flex; gap: 10px; align-items: center;
    background: #fff; color: #111; border-radius: 999px; padding: 6px 10px; box-shadow: 0 4px 18px rgba(0,0,0,.5); font-weight: 600; }
  .switcher button { border: 0; background: #111; color: #fff; border-radius: 999px; width: 30px; height: 30px; cursor: pointer; font-size: 15px; }
  .switcher span { min-width: 220px; text-align: center; }
</style>

<body>
<h1>PROTOTYPE · alba color roles</h1>
<p class="note">Throwaway. Icons are drafts. Blocks and box lines are drawn as full-cell shapes, the way Ghostty draws them. The dashed outline is the pane. Below the pane: the icon sheet (every condition, both frames, every size), then every tier.</p>

<div class="controls" id="controls"></div>
<div class="main">
  <canvas class="pane" id="pane"></canvas>
  <div class="state" id="state"></div>
</div>
<h1 style="margin-top:22px">icon sheet</h1>
<canvas class="pane" id="sheet"></canvas>
<div class="gallery" id="gallery"></div>

<div class="switcher">
  <button id="prev" title="previous variant (←)">←</button>
  <span id="vlabel"></span>
  <button id="next" title="next variant (→)">→</button>
</div>

<script>
// ---------- state & url ----------
const Q = new URLSearchParams(location.search);
const state = {
  variant: Q.get('variant') || 'A',
  cond: Q.get('cond') || 'rain',
  crescent: Q.get('crescent') || '2px',  // minimum crescent width: exact, 2px, 3px
  moonDark: Q.get('moonDark') || 'faint',  // the moon's unlit side: faint, solid, none
  stars: Q.get('stars') || 'glyph',        // night stars: glyph, pixel, none
  flash: Q.get('flash') || '8',            // thunderstorm flash: every 8 s, every 20 s, or off
  flashWhat: Q.get('flashWhat') || 'cloud',// what lights up: cloud, bolt, both
  fps: +Q.get('fps') || 2,                 // animation frames per second
  time: Q.get('time') || 'now',
  ghost: Q.get('ghost') || 'on',
  fmt: Q.get('fmt') || '24',          // 24 or 12 hour
  ampm: Q.get('ampm') || 'stack',     // 12h mark on the LCD clock: stack or text
  lgT: +Q.get('lgT') || 2,            // segment thickness of the Large clock
  dgap: +Q.get('dgap') || 1,          // pixels between digits
  cgap: Q.get('cgap') || 'auto',      // pixels on each side of the colon
  colon: Q.get('colon') || 'ghost',   // colon when off: ghost, blank; or steady (never blinks)
  cshape: Q.get('cshape') || 'dot',   // colon dots: dot (square) or tall
  tails: Q.get('tails') || 'on',      // top bar on 6, bottom bar on 9
  hook: Q.get('hook') || 'off',       // 7 with a left hook (segment f)
  phase: Q.get('phase') || 'auto',
  cols: +Q.get('cols') || 85,
  rows: +Q.get('rows') || 26,
  lang: Q.get('lang') || 'en',
  date: Q.get('date') || 'now',
  bezel: Q.get('bezel') || 'open',
  palette: Q.get('palette') || 'gkrc-dark',
  zoom: +Q.get('zoom') || 2,
};
const syncURL = () => history.replaceState(null, '', '?' + new URLSearchParams(state));

// ---------- palettes (16 terminal colors + fg/bg) ----------
const PALETTES = {
  'gkrc-dark':  { bg: '#16120e', fg: '#e3d6b8', c: ['#16120e','#d25f42','#8f9a5a','#d49a3a','#7f93a8','#a8707a','#7aa08c','#cfc1a3','#8d7d65','#dd7357','#b0b878','#e8bd6a','#a3b3c2','#c9939a','#9fc0ab','#f3ead3'] },
  'gkrc-light': { bg: '#eddca8', fg: '#241a0c', c: ['#241a0c','#9a3522','#4f5a1c','#7a4f06','#34506a','#763a48','#2f6048','#7d6c4c','#6a5737','#82291a','#414a14','#664105','#2c4358','#61303c','#26503c','#241a0c'] },
  'generic-dark':  { bg: '#000000', fg: '#e5e5e5', c: ['#000000','#c23621','#25bc24','#adad27','#492ee1','#d338d3','#33bbc8','#cbcccd','#818383','#fc391f','#31e722','#eaec23','#5833ff','#f935f8','#14f0f0','#e9ebeb'] },
  'generic-light': { bg: '#ffffff', fg: '#000000', c: ['#000000','#990000','#00a600','#999900','#0000b2','#b200b2','#00a6b2','#bfbfbf','#666666','#e50000','#00d900','#e5e500','#0000ff','#e500e5','#00e5e5','#e5e5e5'] },
};
// Color roles from the proposal, by terminal color name.
// Color roles decided in kttq/alba#7: clock, cloud, snow, fog, stars use the default foreground; blues are bright blue.
const ROLE = { fg: 'fg', clock: 'fg', ghost: 8, frame: 8, dim: 8, accent: 3, date: 12, secondary: 2, rain: 12, snow: 'fg', cloud: 'fg', weekend: 2 };
// A role written '~N' means terminal color N in faint style.
const color = (pal, role) => { if (typeof role === 'string' && role[0] === '~') { role = role.slice(1); if (role !== 'fg') role = +role; } const r = ROLE[role] ?? role; return r === 'fg' ? pal.fg : pal.c[r]; };
const isFaint = r => r === 'ghost' || (typeof r === 'string' && r[0] === '~');

// ---------- strings ----------
const STR = {
  en: {
    days: ['sunday','monday','tuesday','wednesday','thursday','friday','saturday'],
    short: ['sun','mon','tue','wed','thu','fri','sat'],
    months: ['january','february','march','april','may','june','july','august','september','october','november','december'],
    cal: ['mo','tu','we','th','fr','sa','su'],
    cond: 'rain', wk: 'wk', next12: 'rain · next 12h', sunsetIn: 'sunset in',
    phases: ['new moon', 'waxing crescent', 'first quarter', 'waxing gibbous', 'full moon', 'waning gibbous', 'last quarter', 'waning crescent'], sunriseIn: 'sunrise in',
    conds: { clear: 'clear', partly: 'partly cloudy', cloudy: 'cloudy', fog: 'fog', drizzle: 'drizzle', rain: 'rain', heavy: 'heavy rain', snow: 'snow', storm: 'thunderstorm' },
    greet: h => h < 5 ? 'sleep soon ✦' : h < 12 ? 'good morning ♥' : h < 18 ? 'good afternoon ★' : h < 23 ? 'good evening ★' : 'sleep soon ✦',
  },
  es: {
    days: ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'],
    short: ['dom','lun','mar','mié','jue','vie','sáb'],
    months: ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'],
    cal: ['lu','ma','mi','ju','vi','sá','do'],
    cond: 'lluvia', wk: 'sem', next12: 'lluvia · 12 h', sunsetIn: 'atardece en',
    phases: ['luna nueva', 'luna creciente', 'cuarto creciente', 'gibosa creciente', 'luna llena', 'gibosa menguante', 'cuarto menguante', 'luna menguante'], sunriseIn: 'amanece en',
    conds: { clear: 'despejado', partly: 'algo nublado', cloudy: 'nublado', fog: 'niebla', drizzle: 'llovizna', rain: 'lluvia', heavy: 'lluvia fuerte', snow: 'nieve', storm: 'tormenta' },
    greet: h => h < 5 ? 'a dormir pronto ✦' : h < 12 ? 'buenos días ♥' : h < 20 ? 'buenas tardes ★' : h < 23 ? 'buenas noches ★' : 'a dormir pronto ✦',
  },
};
const len = s => [...s].length;

// ---------- blocks: a grid of cells, each {ch, role, bold} or null ----------
const blank = (w, h) => ({ w, h, cells: Array.from({ length: h }, () => Array(w).fill(null)) });
function line(...segs) {
  const cells = [];
  for (const [t, role = 'fg', bold = false] of segs) for (const ch of t) cells.push(ch === ' ' ? null : { ch, role, bold, dim: isFaint(role) });
  return { w: cells.length, h: 1, cells: [cells] };
}
function art(rows, roleOf) {
  const h = rows.length, w = Math.max(...rows.map(len)), b = blank(w, h);
  rows.forEach((r, y) => [...r].forEach((ch, x) => { if (ch !== ' ') b.cells[y][x] = { ch, role: typeof roleOf === 'function' ? roleOf(ch) : roleOf, bold: false }; }));
  return b;
}
function place(dst, src, x, y) {
  for (let j = 0; j < src.h; j++) for (let i = 0; i < src.w; i++) {
    const c = src.cells[j][i];
    if (c && y + j >= 0 && y + j < dst.h && x + i >= 0 && x + i < dst.w) dst.cells[y + j][x + i] = c;
  }
}
const sp = (h = 1) => blank(0, h);
function vstack(bs, { align = 'center' } = {}) {
  bs = bs.filter(Boolean);
  const w = Math.max(0, ...bs.map(b => b.w)), h = bs.reduce((s, b) => s + b.h, 0), o = blank(w, h);
  let y = 0;
  for (const b of bs) { place(o, b, align === 'center' ? Math.floor((w - b.w) / 2) : 0, y); y += b.h; }
  return o;
}
function hstack(bs, { gap = 1, valign = 'top' } = {}) {
  bs = bs.filter(Boolean);
  const h = Math.max(0, ...bs.map(b => b.h)), w = bs.reduce((s, b) => s + b.w, 0) + gap * Math.max(0, bs.length - 1), o = blank(w, h);
  let x = 0;
  for (const b of bs) { place(o, b, x, valign === 'center' ? Math.floor((h - b.h) / 2) : valign === 'bottom' ? h - b.h : 0); x += b.w + gap; }
  return o;
}

// ---------- context (time, date, strings) ----------
function makeCtx(real) {
  const S = STR[state.lang];
  // The "time" control overrides the clock so the sun arc and day/night icons can be previewed.
  const now = new Date(real);
  if (state.time !== 'now') { const [H, M] = state.time.split(':').map(Number); now.setHours(H, M); }
  // "longest" = the widest header in either language: wednesday / miércoles 30 september / septiembre.
  const date = state.date === 'longest' ? new Date(2026, 8, 30, now.getHours(), now.getMinutes(), now.getSeconds()) : now;
  // 12-hour: no leading zero, so the first digit is blank (" 6"); on the LCD it shows as a ghost 8.
  const H24 = now.getHours(), pm = H24 >= 12;
  const hh = state.fmt === '12' ? String(H24 % 12 || 12).padStart(2, ' ') : String(H24).padStart(2, '0');
  const mm = String(now.getMinutes()).padStart(2, '0');
  const mins = now.getHours() * 60 + now.getMinutes(), rise = 6 * 60 + 14, set = 19 * 60 + 6;
  const day = mins >= rise && mins < set;
  const RAIN = { rain: [20, 35, 60, 85, 70, 45, 30, 20, 15, 10, 5, 5], storm: [40, 70, 90, 80, 50, 30, 20, 10, 5, 5, 5, 0], snow: [30, 40, 50, 50, 40, 30, 20, 10, 10, 5, 0, 0], partly: [0, 0, 5, 10, 20, 15, 5, 0, 0, 0, 0, 0], clear: Array(12).fill(0), cloudy: [5, 5, 10, 10, 15, 10, 5, 5, 0, 0, 0, 0], fog: Array(12).fill(0), drizzle: [40, 50, 45, 30, 20, 10, 5, 5, 0, 0, 0, 0], heavy: [80, 95, 100, 90, 70, 50, 30, 20, 10, 5, 5, 0] };
  return {
    S, date, hh, mm, pm, hour: now.getHours(),
    colonOn: state.colon === 'steady' || real.getMilliseconds() < 500,   // blink once per second
    frame2: Math.floor(real.getTime() * state.fps / 1000) % 2,   // two-frame idle animation
    // The flash lasts 300 ms, longer than one 250 ms redraw tick, so a tick never misses it.
    flash: state.flash !== 'off' && real.getTime() % (+state.flash * 1000) < 300,
    temp: '14°', hi: '18°', lo: '9°', sunrise: '06:14', sunset: '19:06',
    cond: state.cond, day, night: !day,
    dayProgress: day ? (mins - rise) / (set - rise) : null,
    toSunrise: day ? null : ((rise - mins + 1440) % 1440),
    toSunset: day ? set - mins : null,
    nightProgress: day ? null : ((mins - set + 1440) % 1440) / (1440 - (set - rise)),
    phase: state.phase === 'auto' ? moonPhase(now) : +state.phase,
    rain12: RAIN[state.cond],
  };
}

// ---------- components ----------
// Text clock for Mini and Strip: "06:38", or "6:38pm" in 12-hour. The colon follows the colon control:
// blinks to faint (ghost), blinks to blank, or stays on (steady).
const textClock = c => {
  const colon = c.colonOn ? [':', 'clock'] : state.colon === 'blank' ? [' ', 'clock'] : [':', 'ghost'];
  return [[c.hh.trim(), 'clock'], colon, [c.mm, 'clock'], ...(state.fmt === '12' ? [[c.pm ? 'pm' : 'am', 'dim']] : [])];
};
const smallClock = c => line(...textClock(c));
// PLACEHOLDER icons (rain). The real set belongs to "Weather icons: the full set with two animation frames".
const iconFull = c => art(['  ▄▄▄▄  ', '▄██████▄', ...(c.frame2 ? ['   ‚  ‚ ', ' ‚  ‚  ‚'] : [' ‚  ‚  ‚', '   ‚  ‚ '])], ch => ch === '‚' ? 'rain' : 'cloud');
const iconMini = c => art(['▄██▄', c.frame2 ? ' ‚ ‚' : '‚ ‚ '], ch => ch === '‚' ? 'rain' : 'cloud');
const tempLine = c => line([c.temp, 'fg', true], [' ' + c.S.cond, 'secondary']);
const sunLine = c => line(['↑', 'accent'], [c.sunrise, 'dim'], ['  ↓', 'accent'], [c.sunset, 'dim']);
const credit = () => line(['open-meteo.com', 'dim']);
const details4 = c => vstack([line([c.temp, 'fg', true]), line([c.S.cond, 'secondary']), line(['↑', 'accent'], [c.sunrise, 'dim']), line(['↓', 'accent'], [c.sunset, 'dim'])], { align: 'left' });

// Month calendar, Monday first. Always 6 week rows, so the layout never jumps between months.
function monthCal(c) {
  const d = c.date, y = d.getFullYear(), m = d.getMonth(), today = d.getDate();
  const days = new Date(y, m + 1, 0).getDate(), off = (new Date(y, m, 1).getDay() + 6) % 7;
  const b = blank(20, 8), title = `${c.S.months[m]} ${y}`;
  place(b, line([title, 'date']), Math.floor((20 - len(title)) / 2), 0);
  c.S.cal.forEach((w, i) => place(b, line([w, i >= 5 ? 'weekend' : 'dim']), i * 3, 1));
  for (let day = 1; day <= days; day++) {
    const idx = off + day - 1, col = idx % 7, row = Math.floor(idx / 7);
    const role = day === today ? 'accent' : day < today ? 'dim' : col >= 5 ? 'weekend' : 'fg';
    place(b, line([String(day).padStart(2, ' '), role, day === today]), col * 3, 2 + row);
  }
  return b;
}
// One-week strip: the current week only.
function weekStrip(c) {
  const d = c.date, dow = (d.getDay() + 6) % 7, b = blank(20, 2);
  c.S.cal.forEach((w, i) => {
    const day = new Date(d.getFullYear(), d.getMonth(), d.getDate() - dow + i);
    const isToday = i === dow;
    place(b, line([w, i >= 5 ? 'weekend' : 'dim']), i * 3, 0);
    place(b, line([String(day.getDate()).padStart(2, ' '), isToday ? 'accent' : i < dow ? 'dim' : i >= 5 ? 'weekend' : 'fg', isToday]), i * 3, 1);
  });
  return b;
}
const headerText = c => [[c.S.days[c.date.getDay()], 'date'], [state.bezel === 'none' ? ' · ' : ' ─ ', 'frame'], [`${c.date.getDate()} ${c.S.months[c.date.getMonth()]}`, 'date']];
const footerText = c => [[c.S.greet(c.hour), 'secondary']];

// ---------- bezel ----------
// none:   plain header and footer lines, no box characters.
// open:   the proposal's Starship look, ╭─ header and ╰─» footer, no sides.
// closed: a box that hugs the content; header and footer sit in the top and bottom border.
// fill:   a box that fills the whole pane, like a gadget's screen edge.
function applyBezel(inner, c, withText, W, H) {
  const hdr = withText ? headerText(c) : null, ftr = withText ? footerText(c) : null;
  const segLen = segs => segs.reduce((s, [t]) => s + len(t), 0);
  const mode = state.bezel;
  if (mode === 'none' || mode === 'open') {
    if (!withText) return inner;
    const h = mode === 'open' ? line(['╭─ ', 'frame'], ...hdr) : line(...hdr);
    const f = mode === 'open' ? line(['╰─» ', 'frame'], ...ftr) : line(...ftr);
    const w = Math.max(inner.w, h.w, f.w), o = blank(w, inner.h + 2);
    place(o, h, 0, 0); place(o, inner, Math.floor((w - inner.w) / 2), 1); place(o, f, 0, inner.h + 1);
    return o;
  }
  // closed / fill: sides plus one space of padding on each side.
  const minW = Math.max(inner.w + 4, withText ? Math.max(segLen(hdr) + 6, segLen(ftr) + 7) : 0), minH = inner.h + 2;
  const w = mode === 'fill' ? W : minW, h = mode === 'fill' ? H : minH;
  if (w < minW || h < minH) return { w: Infinity, h: Infinity, minW, minH };
  const o = blank(w, h);
  const top = withText ? line(['╭─ ', 'frame'], ...hdr, [' ', 'frame']) : line(['╭', 'frame']);
  const bot = withText ? line(['╰─» ', 'frame'], ...ftr, [' ', 'frame']) : line(['╰', 'frame']);
  for (let x = 1; x < w - 1; x++) { o.cells[0][x] = { ch: '─', role: 'frame' }; o.cells[h - 1][x] = { ch: '─', role: 'frame' }; }
  for (let y = 1; y < h - 1; y++) { o.cells[y][0] = { ch: '│', role: 'frame' }; o.cells[y][w - 1] = { ch: '│', role: 'frame' }; }
  // Copy the text rows cell by cell, spaces included, so the border line doesn't show through the gaps.
  top.cells[0].forEach((cell, x) => { o.cells[0][x] = cell; });
  bot.cells[0].forEach((cell, x) => { o.cells[h - 1][x] = cell; });
  o.cells[0][w - 1] = { ch: '╮', role: 'frame' }; o.cells[h - 1][w - 1] = { ch: '╯', role: 'frame' };
  place(o, inner, Math.floor((w - inner.w) / 2), 1 + Math.floor((h - 2 - inner.h) / 2));
  o.minW = minW; o.minH = minH;
  return o;
}

// ---------- Mini and Strip tiers ----------
const stripTier = {
  name: 'strip', credit: false, framed: false, strip: true,
  options: c => [
    line(...textClock(c), [' · ', 'dim'], [`${c.S.short[c.date.getDay()]} ${c.date.getDate()}`, 'date'], [' · ', 'dim'], [c.temp + ' ', 'fg'], ['‚‚', 'rain']),
    line(...textClock(c), [' · ', 'dim'], [c.temp + ' ', 'fg'], ['‚‚', 'rain']),
    line(...textClock(c)),
  ],
};

// =====================================================================
// Variants D and E: the "break free" designs.
// Pixel engine: each cell holds two square pixels, top and bottom, drawn with ▀ ▄ █ and a
// foreground plus background color. ratatui can do this with Cell fg/bg.
// "ghost" pixels are bright black with the terminal's faint (dim) style, like unlit LCD segments.
// =====================================================================
function pcell(t, u) {
  if (!t && !u) return null;
  if (t === u) return { ch: '█', role: t, dim: isFaint(t) };
  if (t && !u) return { ch: '▀', role: t, dim: isFaint(t) };
  if (!t && u) return { ch: '▄', role: u, dim: isFaint(u) };
  // Both set and different: the faint pixel must be the foreground, because the background can't be faint.
  if (isFaint(u)) return { ch: '▄', role: u, dim: true, bg: t };
  return { ch: '▀', role: t, dim: isFaint(t), bg: u };
}
// grid: rows of roles (or null), any height; returns a block of ceil(h/2) rows.
function fromGrid(grid) {
  const hp = grid.length, w = Math.max(0, ...grid.map(r => r.length)), b = blank(w, Math.ceil(hp / 2));
  for (let y = 0; y < b.h; y++) for (let x = 0; x < w; x++) b.cells[y][x] = pcell(grid[2 * y]?.[x] ?? null, grid[2 * y + 1]?.[x] ?? null);
  return b;
}
const pix = (rows, legend) => fromGrid(rows.map(r => [...r].map(ch => legend[ch] ?? null)));
const ghostOn = () => state.ghost === 'on';

// Seven-segment digits, w×h pixels, segment thickness t. Segments stop short of the corners.
const SEG = { 0: 'abcdef', 1: 'bc', 2: 'abged', 3: 'abgcd', 4: 'fgbc', 5: 'afgcd', 6: 'afgedc', 7: 'abc', 8: 'abcdefg', 9: 'abcdfg' };
const SMALL = { w: 4, h: 7, t: 1 }, LARGE = () => ({ w: 8, h: 15, t: state.lgT });
function segsOf(d) {
  let s = SEG[d];
  if (state.tails === 'off' && d === '6') s = s.replace('a', '');
  if (state.tails === 'off' && d === '9') s = s.replace('d', '');
  if (state.hook === 'on' && d === '7') s += 'f';
  return s;

  for (let i = -1; i < 3; i++) if (x + i >= 0 && x + i < 20) { const cell = b.cells[y][x + i]; b.cells[y][x + i] = { ch: cell?.ch ?? ' ', role: 'accent', inverse: true, bold: true }; }
  return b;
}
function weekPill(c) {
  const b = weekStrip(c), dow = (c.date.getDay() + 6) % 7, x = dow * 3;
  for (let i = -1; i < 3; i++) if (x + i >= 0 && x + i < 20) { const cell = b.cells[1][x + i]; b.cells[1][x + i] = { ch: cell?.ch ?? ' ', role: 'accent', inverse: true, bold: true }; }
  return b;
}
const isoWeek = d => { const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); const n = (t.getUTCDay() + 6) % 7; t.setUTCDate(t.getUTCDate() - n + 3); const f = new Date(Date.UTC(t.getUTCFullYear(), 0, 4)); return 1 + Math.round(((t - f) / 864e5 - 3 + ((f.getUTCDay() + 6) % 7)) / 7); };
const shortDate = c => `${c.S.short[c.date.getDay()]} ${c.date.getDate()} ${c.S.months[c.date.getMonth()].slice(0, 3)}`;
const hiLo = c => line([c.temp, 'fg', true], ['  ↑', 'dim'], [c.hi, 'fg'], [' ↓', 'dim'], [c.lo, 'fg']);

// Gadget bezel: a box that hugs the content, with text on both ends of the top and bottom borders.
function gadgetBox(inner, tl, tr, bl, br) {
  const w = Math.max(inner.w + 4, len(tl.map(s => s[0]).join('')) + len(tr.map(s => s[0]).join('')) + 9), h = inner.h + 2, o = blank(w, h);
  for (let x = 1; x < w - 1; x++) { o.cells[0][x] = { ch: '─', role: 'frame' }; o.cells[h - 1][x] = { ch: '─', role: 'frame' }; }
  for (let y = 1; y < h - 1; y++) { o.cells[y][0] = { ch: '│', role: 'frame' }; o.cells[y][w - 1] = { ch: '│', role: 'frame' }; }
  Object.assign(o.cells[0], { 0: { ch: '╭', role: 'frame' }, [w - 1]: { ch: '╮', role: 'frame' } });
  Object.assign(o.cells[h - 1], { 0: { ch: '╰', role: 'frame' }, [w - 1]: { ch: '╯', role: 'frame' } });
  const write = (y, x, segs) => line(...segs).cells[0].forEach((cell, i) => { o.cells[y][x + i] = cell; });
  const L = s => [[' ', 'frame'], ...s, [' ', 'frame']], R = s => len(s.map(p => p[0]).join('')) + 2;
  write(0, 2, L(tl)); write(0, w - 2 - R(tr), L(tr));
  write(h - 1, 1, [['» ', 'frame'], ...bl, [' ', 'frame']]); write(h - 1, w - 2 - R(br), L(br));
  place(o, inner, 2, 1);
  return o;
}
const gadget = (c, inner) => gadgetBox(inner,
  [[shortDate(c), 'date']], [[`${c.S.wk} ${isoWeek(c.date)}`, 'dim']],
  [[c.S.greet(c.hour), 'secondary']], [['open-meteo', 'dim']]);
// Top band shared by D's framed tiers: LCD clock, icon, temperatures, rain sparkline.
const band = c => {
  const clock = lcdClock(c, SMALL);
  return vstack([
    hstack([clock, icon(c, 'full')], { gap: 1 }),
    hstack([vstack([hiLo(c)], { align: 'left' }), rainSpark(c)], { gap: clock.w + 1 - hiLo(c).w }),
  ], { align: 'left' });
};

// The Home layout chosen in kttq/alba#4 (variant D).
const TIERS = [
    { name: 'large', credit: true, build: c => {
      const details = vstack([line([c.temp, 'fg', true], [' ' + c.S.conds[c.cond], 'secondary']), line(['↑', 'dim'], [c.hi, 'fg'], [' ↓', 'dim'], [c.lo, 'fg']), sp(), line([c.S.next12, 'dim']), rainSpark(c)], { align: 'left' });
      const mid = hstack([icon(c, 'large'), details, monthCalPill(c)], { gap: 3 });
      return gadget(c, vstack([lcdClock(c, LARGE()), sp(), mid, sp(), timeline(c, mid.w)]));
    } },
    { name: 'wide', credit: true, build: c => { const b = band(c); return gadget(c, hstack([vstack([b, sp(), timeline(c, b.w)], { align: 'left' }), monthCalPill(c)], { gap: 3 })); } },
    { name: 'tall', credit: true, build: c => { const b = band(c); return gadget(c, vstack([b, line([c.S.conds[c.cond], 'secondary']), sp(), timeline(c, b.w), sp(), monthCalPill(c)])); } },
    { name: 'medium', credit: true, build: c => { const b = band(c); return gadget(c, vstack([b, timeline(c, b.w), weekPill(c)])); } },
    { name: 'compact', credit: false, build: c => vstack([line([shortDate(c), 'date']), lcdClock(c, SMALL), sp(), hstack([icon(c, 'mini'), vstack([hiLo(c), rainSpark(c)], { align: 'left' })], { gap: 2 })]) },
    { name: 'mini', credit: false, build: c => hstack([smallClock(c), icon(c, 'mini'), line([c.temp, 'fg', true])], { gap: 2, valign: 'center' }) },
    stripTier,
];

// ---------- compose: pick the largest tier that fits ----------
function compose(W, H, now) {
  const c = makeCtx(now), tiers = TIERS, table = [];
  let chosen = null;
  for (const t of tiers) {
    let blk, minW, minH;
    if (t.strip) {
      const opts = t.options(c);
      blk = opts.find(o => o.w <= W && H >= 1) || opts[opts.length - 1];
      minW = opts[opts.length - 1].w; minH = 1;
      table.push({ name: t.name, size: `${opts.map(o => o.w).join('/')}×1`, credit: false });
    } else {
      const inner = t.build(c, W, H);
      blk = t.framed ? applyBezel(inner, c, t.text, W, H) : inner;
      minW = blk.minW ?? blk.w; minH = blk.minH ?? blk.h;
      table.push({ name: t.name, size: `${minW}×${minH}`, credit: t.credit });
    }
    if (!chosen && blk.w <= W && blk.h <= H) chosen = { tier: t, blk };
  }
  if (!chosen) { const s = tiers[tiers.length - 1].options(c); chosen = { tier: stripTier, blk: s[s.length - 1], clipped: true }; }
  const pane = blank(W, H);
  const x = Math.floor((W - chosen.blk.w) / 2), y = Math.floor((H - chosen.blk.h) / 2);
  place(pane, chosen.blk, Math.max(0, x), Math.max(0, y));
  return { pane, chosen, table, x, y };
}

// ---------- draw: terminal-style cells on a canvas ----------
let metrics = null;
function measure(zoom) {
  const cv = document.createElement('canvas').getContext('2d');
  cv.font = `${11 * zoom}px DM, "Departure Mono", monospace`;
  const m = cv.measureText('M');
  return { cw: Math.round(m.width), ch: Math.round(m.fontBoundingBoxAscent + m.fontBoundingBoxDescent), asc: m.fontBoundingBoxAscent, font: cv.font };
}
const BLOCK_FRAC = { '▁': 1, '▂': 2, '▃': 3, '▅': 5, '▆': 6, '▇': 7 };
function drawCell(g, cell, x, y, cw, ch, asc, pal) {
  // Background first (half-block pixels with two colors), then reverse video, then the faint style.
  if (cell.bg != null) { g.fillStyle = color(pal, cell.bg); g.fillRect(x, y, cw, ch); }
  if (cell.inverse) { g.fillStyle = color(pal, cell.role); g.fillRect(x, y, cw, ch); }
  g.globalAlpha = cell.dim ? 0.5 : 1;   // Ghostty's default faint-opacity
  drawGlyph(g, { ...cell, col: cell.inverse ? pal.bg : color(pal, cell.role) }, x, y, cw, ch, asc);
  g.globalAlpha = 1;
}
function drawGlyph(g, cell, x, y, cw, ch, asc) {
  const col = cell.col, lw = Math.max(1, Math.round(cw / 7)), mx = x + Math.floor(cw / 2), my = y + Math.floor(ch / 2);
  g.fillStyle = col; g.strokeStyle = col;
  const corner = (x0, y0, x1, y1) => { g.beginPath(); g.lineWidth = lw; g.moveTo(x0, y0); g.arcTo(mx + lw / 2, my + lw / 2, x1, y1, cw / 2); g.lineTo(x1, y1); g.stroke(); };
  switch (cell.ch) {
    case '█': return g.fillRect(x, y, cw, ch);
    case '▀': return g.fillRect(x, y, cw, Math.round(ch / 2));
    case '▄': return g.fillRect(x, y + Math.round(ch / 2), cw, ch - Math.round(ch / 2));
    case '▌': return g.fillRect(x, y, Math.round(cw / 2), ch);
    case '▐': return g.fillRect(x + Math.round(cw / 2), y, cw - Math.round(cw / 2), ch);
    case '░': case '▒': case '▓': g.globalAlpha *= { '░': .25, '▒': .5, '▓': .75 }[cell.ch]; return g.fillRect(x, y, cw, ch);
    case '─': return g.fillRect(x, my, cw, lw);
    case '│': return g.fillRect(mx, y, lw, ch);
    case '╷': return g.fillRect(mx, my, lw, ch - (my - y));
    case '╵': return g.fillRect(mx, y, lw, my - y + lw);
    case '═': g.fillRect(x, my - lw, cw, lw); return g.fillRect(x, my + lw, cw, lw);
    case '╭': return corner(x + cw, my + lw / 2, mx + lw / 2, y + ch);
    case '╮': return corner(x, my + lw / 2, mx + lw / 2, y + ch);
    case '╰': return corner(x + cw, my + lw / 2, mx + lw / 2, y);
    case '╯': return corner(x, my + lw / 2, mx + lw / 2, y);
  }
  if (BLOCK_FRAC[cell.ch]) { const h = Math.round(ch * BLOCK_FRAC[cell.ch] / 8); return g.fillRect(x, y + ch - h, cw, h); }
  g.font = metrics.font;   // no bold: Departure Mono has one weight
  g.fillText(cell.ch, x, y + asc);
}
function render(canvas, grid, zoom) {
  const m = measure(zoom * devicePixelRatio), pal = PALETTES[state.palette];
  metrics = m;
  canvas.width = grid.w * m.cw; canvas.height = grid.h * m.ch;
  canvas.style.width = canvas.width / devicePixelRatio + 'px'; canvas.style.height = canvas.height / devicePixelRatio + 'px';
  const g = canvas.getContext('2d');
  g.fillStyle = pal.bg; g.fillRect(0, 0, canvas.width, canvas.height);
  g.textBaseline = 'alphabetic';
  for (let y = 0; y < grid.h; y++) for (let x = 0; x < grid.w; x++) {
    const cell = grid.cells[y][x];
    if (cell && cell.ch !== ' ' || cell?.inverse || cell?.bg != null) drawCell(g, cell, x * m.cw, y * m.ch, m.cw, m.ch, m.asc, pal);
  }
}

// ---------- controls ----------
// The tier breakpoints from kttq/alba#4, plus the user's real pane (85×26) and a Strip.
const PRESETS = [[18, 2], [23, 8], [40, 12], [63, 11], [40, 21], [69, 23], [85, 26], [30, 1]];
const TIMES = ['now', '08:30', '13:00', '18:45', '23:10'];
function seg(label, key, values) {
  return `<span><label>${label}</label> <span class="seg">${values.map(v => `<button data-k="${key}" data-v="${v}" class="${String(state[key]) === String(v) ? 'on' : ''}">${v}</button>`).join('')}</span></span>`;
}
function drawControls() {
  document.getElementById('controls').innerHTML = [
    `<span><label>pane</label> <input type="number" id="cols" min="1" max="200" value="${state.cols}"> × <input type="number" id="rows" min="1" max="80" value="${state.rows}"></span>`,
    `<span class="seg">${PRESETS.map(([w, h]) => `<button data-preset="${w}x${h}" class="${state.cols === w && state.rows === h ? 'on' : ''}">${w}×${h}</button>`).join('')}</span>`,
    seg('weather', 'cond', CONDS),
    seg('time', 'time', TIMES),
    seg('moon phase', 'phase', ['auto', '0.12', '0.25', '0.38', '0.5', '0.62', '0.75', '0.88']),
    seg('crescent', 'crescent', ['exact', '2px', '3px']),
    seg('moon dark side', 'moonDark', ['faint', 'solid', 'none']),
    seg('stars', 'stars', ['glyph', 'pixel', 'none']),
    seg('flash every', 'flash', ['8', '20', 'off']),
    seg('flash lights', 'flashWhat', ['cloud', 'bolt', 'both']),
    seg('frames per second', 'fps', [1, 2, 4]),
    seg('lang', 'lang', ['en', 'es']),
    seg('palette', 'palette', Object.keys(PALETTES)),
    seg('zoom', 'zoom', [1, 2, 3]),
  ].join('');
  document.querySelectorAll('[data-k]').forEach(b => b.onclick = () => { const k = b.dataset.k; state[k] = typeof state[k] === 'number' ? +b.dataset.v : b.dataset.v; update(); });
  document.querySelectorAll('[data-preset]').forEach(b => b.onclick = () => { [state.cols, state.rows] = b.dataset.preset.split('x').map(Number); update(); });
  document.getElementById('cols').onchange = e => { state.cols = Math.max(1, +e.target.value); update(); };
  document.getElementById('rows').onchange = e => { state.rows = Math.max(1, +e.target.value); update(); };
}
const cycle = (key, list, dir = 1) => { state[key] = list[(list.indexOf(state[key]) + dir + list.length) % list.length]; update(); };
document.getElementById('prev').onclick = () => cycle('variant', VKEYS, -1);
document.getElementById('next').onclick = () => cycle('variant', VKEYS, 1);
addEventListener('keydown', e => {
  if (e.target.closest('input, textarea, [contenteditable]')) return;
  if (e.key === 'ArrowLeft') cycle('variant', VKEYS, -1);
  if (e.key === 'ArrowRight') cycle('variant', VKEYS, 1);
  if (e.key === 'w') cycle('cond', CONDS);
  if (e.key === 't') cycle('time', TIMES);
  if (e.key === 'p') cycle('palette', Object.keys(PALETTES));
});

// ---------- icon sheet: every condition, live and both frames, at every size ----------
const SHEET_ROWS = [['clear'], ['clear', true], ['partly'], ['partly', true], ['cloudy'], ['fog'], ['drizzle'], ['rain'], ['heavy'], ['snow'], ['storm'], ['storm', false, true]];
function sheet(c) {
  const cols = [['', 16], ['live', 12], ['frame 1', 12], ['frame 2', 12], ['mini', 6], ['', 6], ['large live', 24], ['large frame 1', 24], ['large frame 2', 24]];
  const rows = [line(...cols.map(([t, w]) => [t.padEnd(w + 3), 'dim']))];
  for (const [cond, night = false, flash = false] of SHEET_ROWS) {
    const at = f => ({ ...c, cond, night, day: !night, frame2: f ?? c.frame2, flash: f == null ? c.flash : flash });
    const label = cond + (night ? ' night' : '') + (flash ? ' flash' : '');
    rows.push(hstack([line([label.padEnd(16), 'dim']), icon(at(), 'full'), icon(at(0), 'full'), icon(at(1), 'full'),
      icon(at(0), 'mini'), icon(at(1), 'mini'), icon(at(), 'large'), icon(at(0), 'large'), icon(at(1), 'large')], { gap: 3 }), sp());
  }
  return vstack(rows, { align: 'left' });
}

// ---------- loop ----------
function frame() {
  const now = new Date();
  const r = compose(state.cols, state.rows, now), c = makeCtx(now);
  render(document.getElementById('pane'), r.pane, state.zoom);
  render(document.getElementById('sheet'), sheet(c), Math.max(1, state.zoom - 1));
  const t = r.chosen;
  document.getElementById('state').textContent = [
    `variant   ${state.variant} · ${VARIANTS[state.variant].name}`,
    `pane      ${state.cols}×${state.rows}   tier ${t.tier.name}${r.chosen.clipped ? '   ⚠ CLIPPED: nothing fits' : ''}`,
    `content   ${t.blk.w}×${t.blk.h}   leftover ${state.cols - t.blk.w} cols, ${state.rows - t.blk.h} rows`,
    ``,
    `weather   ${state.cond} (${c.night ? 'night' : 'day'})   time ${state.time}   frame ${c.frame2 + 1} at ${state.fps} fps`,
    `moon      phase ${state.phase} · crescent ${state.crescent} · dark side ${state.moonDark} · stars ${state.stars}`,
    `flash     ${state.flash === 'off' ? 'off' : `every ${state.flash} s, lights the ${state.flashWhat}`}${c.flash ? '   ⚡ NOW' : ''}`,
    `palette   ${state.palette}   lang ${state.lang}`,
    ``,
    `smallest pane for each tier (= its breakpoint):`,
    ...r.table.map(x => `  ${x.name.padEnd(10)} ${x.size}${x.credit ? '' : '  (no credit)'}`),
  ].join('\n');
  // gallery: every preset size, one zoom step smaller
  const gal = document.getElementById('gallery');
  if (gal.children.length !== PRESETS.length) gal.innerHTML = PRESETS.map(() => '<figure><canvas class="pane"></canvas><figcaption></figcaption></figure>').join('');
  PRESETS.forEach(([w, h], i) => {
    const fig = gal.children[i], g = compose(w, h, now);
    render(fig.querySelector('canvas'), g.pane, Math.max(1, state.zoom - 1));
    fig.querySelector('figcaption').textContent = `${w}×${h} → ${g.chosen.tier.name}${g.chosen.clipped ? ' ⚠' : ''}`;
  });
}
function update() { syncURL(); drawControls(); document.getElementById('vlabel').textContent = `${state.variant} · ${VARIANTS[state.variant].name.split(' (')[0]}`; frame(); }

document.fonts.load('22px DM').finally(() => { update(); setInterval(frame, 250); });
</script>
</body>
